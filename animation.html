<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARIA VELEN — Official Artist Website</title>

  <!-- Google Fonts: Luxury Editorial Serif & Modern Geometric Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800;900&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23070707' stroke='%23d4af37' stroke-width='2'/%3E%3Ctext x='16' y='22' font-family='serif' font-size='18' font-weight='bold' fill='%23d4af37' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  
</head>
  <style>
    /* Screen-Sized Animation Chamber Specific Styles */
    body.animation-chamber-page {
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    .studio-viewport {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 100px 48px 40px;
    }

    /* Top Model Selector Ribbon */
    .studio-model-ribbon {
      align-self: center;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 6px 10px;
      background: rgba(14, 13, 11, 0.78);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(212, 175, 55, 0.28);
      border-radius: 9999px;
      pointer-events: auto;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }

    .studio-tab-btn {
      padding: 9px 20px;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 9999px;
      color: #9c978e;
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      transition: all 0.28s ease;
    }

    .studio-tab-btn:hover {
      color: var(--gold-light);
      background: rgba(212, 175, 55, 0.12);
    }

    .studio-tab-btn.active {
      color: #070707;
      background: var(--gold-primary);
      border-color: var(--gold-primary);
      font-weight: 700;
      box-shadow: 0 0 18px rgba(212, 175, 55, 0.5);
    }

    /* Bottom Control Bar */
    .studio-bottom-deck {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      width: 100%;
      pointer-events: none;
    }

    .studio-left-telemetry {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: rgba(14, 13, 11, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(212, 175, 55, 0.2);
      border-radius: 12px;
      padding: 16px 22px;
      pointer-events: auto;
    }

    .telemetry-title {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.3em;
      color: var(--gold-primary);
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .telemetry-item {
      display: flex;
      align-items: center;
      gap: 14px;
      font-family: var(--font-mono);
      font-size: 11px;
      color: #ede8dc;
    }

    .telemetry-label {
      color: #7a766e;
      letter-spacing: 0.15em;
    }

    .telemetry-val {
      color: var(--gold-light);
      font-weight: 600;
    }

    .studio-right-controls {
      display: flex;
      flex-direction: column;
      gap: 14px;
      background: rgba(14, 13, 11, 0.78);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(212, 175, 55, 0.28);
      border-radius: 16px;
      padding: 20px 24px;
      pointer-events: auto;
      min-width: 320px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
    }

    .control-row {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .control-label {
      display: flex;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.25em;
      color: var(--gold-light);
      text-transform: uppercase;
    }

    .control-slider {
      -webkit-appearance: none;
      width: 100%;
      height: 4px;
      border-radius: 2px;
      background: rgba(212, 175, 55, 0.25);
      outline: none;
    }

    .control-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--gold-bright);
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
      cursor: pointer;
    }

    .material-button-group {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .mat-btn {
      padding: 7px 4px;
      background: rgba(25, 23, 20, 0.8);
      border: 1px solid rgba(212, 175, 55, 0.2);
      border-radius: 6px;
      color: #9c978e;
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      text-align: center;
      transition: all 0.2s ease;
    }

    .mat-btn:hover {
      border-color: var(--gold-primary);
      color: var(--gold-light);
    }

    .mat-btn.active {
      background: rgba(212, 175, 55, 0.22);
      border-color: var(--gold-bright);
      color: var(--gold-bright);
      font-weight: 700;
    }

    .studio-action-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
    }

    .studio-action-btn {
      flex: 1;
      padding: 9px 12px;
      background: rgba(25, 23, 20, 0.8);
      border: 1px solid rgba(212, 175, 55, 0.25);
      border-radius: 8px;
      color: #ede8dc;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.25s ease;
    }

    .studio-action-btn:hover {
      border-color: var(--gold-light);
      background: rgba(212, 175, 55, 0.15);
      color: var(--gold-light);
    }

    .studio-action-btn.active {
      border-color: #55d070;
      color: #55d070;
    }

    .drag-hint-banner {
      position: absolute;
      top: 175px;
      left: 50%;
      transform: translateX(-50%);
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.35em;
      color: rgba(212, 175, 55, 0.6);
      text-transform: uppercase;
      pointer-events: none;
      animation: floatBreath 3s ease-in-out infinite alternate;
    }

    @keyframes floatBreath {
      from { opacity: 0.4; transform: translate(-50%, 0); }
      to { opacity: 0.85; transform: translate(-50%, -4px); }
    }
  </style>
</head>
<body data-page="animation" class="animation-chamber-page">

  <!-- Custom Cursor System -->
  <div id="custom-cursor" class="custom-cursor" aria-hidden="true">
    <div class="cursor-dot"></div>
    <div class="cursor-ring">
      <div class="cursor-badge">
        <span class="cursor-letter">3</span>
        <span class="cursor-symbol">
          <svg viewBox="0 0 24 24" class="split-disc-icon">
            <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
            <path d="M12 3 L12 21 M3 12 L21 12" stroke="currentColor" stroke-width="1.5"/>
          </svg>
        </span>
        <span class="cursor-letter">D</span>
      </div>
      <div class="cursor-subtext" id="cursor-action-label"></div>
    </div>
  </div>

  <!-- Background WebGL 3D Canvas -->
  <canvas id="webgl-canvas"></canvas>

  <div class="noise-overlay" aria-hidden="true"></div>

  <!-- Site Header -->
  <header class="site-header" id="site-header">
    <div class="header-container">
      <a href="index.html" class="brand-logo" data-cursor="HOME">
        <span class="brand-dash">—</span>
        <span class="brand-name">ARIA VELEN</span>
      </a>

      <!-- Main Navigation -->
      <nav class="main-nav" aria-label="Main Navigation">
        <ul class="nav-list">
          <li class="nav-item">
            <a href="index.html" class="nav-link" data-cursor="HOME">
              <span class="nav-text">HOME</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="about.html" class="nav-link" data-cursor="ABOUT">
              <span class="nav-text">ABOUT</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="music.html" class="nav-link" data-cursor="MUSIC">
              <span class="nav-text">MUSIC</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="tour.html" class="nav-link" data-cursor="TOUR">
              <span class="nav-text">TOUR</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="contact.html" class="nav-link" data-cursor="CONTACT">
              <span class="nav-text">CONTACT</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="animation.html" class="nav-link active" data-cursor="3D ANIMATION">
              <span class="nav-text">ANIMATION</span>
            </a>
          </li>
        </ul>
      </nav>

      <div class="header-actions">
        <button class="sound-toggle-btn" id="sound-toggle-btn" title="Toggle Ethereal Audio Experience" data-cursor="SOUND">
          <span class="sound-wave-bars">
            <span class="bar bar-1"></span>
            <span class="bar bar-2"></span>
            <span class="bar bar-3"></span>
            <span class="bar bar-4"></span>
          </span>
          <span class="sound-label" id="sound-status-text">SOUND: OFF</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Screensized Animation Chamber Viewport -->
  <div class="studio-viewport">
    
    <!-- Top Model Switcher Ribbon -->
    <div class="studio-model-ribbon">
      <button class="studio-tab-btn active" data-model="a" data-cursor="SELECT">MONUMENTAL 'A'</button>
      <button class="studio-tab-btn" data-model="knot" data-cursor="SELECT">BRONZE KNOT</button>
      <button class="studio-tab-btn" data-model="vinyl" data-cursor="SELECT">VINYL DECK</button>
      <button class="studio-tab-btn" data-model="globe" data-cursor="SELECT">WORLD GLOBE</button>
      <button class="studio-tab-btn" data-model="wave" data-cursor="SELECT">CYMATIC WAVE</button>
    </div>

    <!-- Drag Hint -->
    <div class="drag-hint-banner">— DRAG TO ORBIT IN 3D SPACE —</div>

    <!-- Bottom HUD & Controls -->
    <div class="studio-bottom-deck">
      
      <!-- Telemetry Info -->
      <div class="studio-left-telemetry">
        <span class="telemetry-title">TELEMETRY // KINETIC MATRIX</span>
        <div class="telemetry-item">
          <span class="telemetry-label">FPS RATE:</span>
          <span class="telemetry-val" id="fps-display">60.0 FPS</span>
        </div>
        <div class="telemetry-item">
          <span class="telemetry-label">ENGINE:</span>
          <span class="telemetry-val">THREE.JS 60FPS PBR</span>
        </div>
        <div class="telemetry-item">
          <span class="telemetry-label">VIEWPORT:</span>
          <span class="telemetry-val">100VW × 100VH PURE</span>
        </div>
      </div>

      <!-- Interactive Controls -->
      <div class="studio-right-controls">
        <div class="control-row">
          <div class="control-label">
            <span>KINETIC SPEED</span>
            <span id="speed-val">1.0x</span>
          </div>
          <input type="range" class="control-slider" id="speed-slider" min="0.1" max="3.0" step="0.1" value="1.0" data-cursor="SLIDER">
        </div>

        <div class="control-row">
          <div class="control-label">
            <span>SURFACE LUSTRE</span>
          </div>
          <div class="material-button-group">
            <button class="mat-btn active" data-mat="gold" data-cursor="GOLD">24K GOLD</button>
            <button class="mat-btn" data-mat="chrome" data-cursor="CHROME">OBSIDIAN</button>
            <button class="mat-btn" data-mat="platinum" data-cursor="PLATINUM">PLATINUM</button>
            <button class="mat-btn" data-mat="rose" data-cursor="ROSE">ROSE</button>
          </div>
        </div>

        <div class="studio-action-row">
          <button class="studio-action-btn" id="sound-pulse-toggle" data-cursor="PULSE">
            <span>⚡ AUDIO PULSE</span>
          </button>
          <button class="studio-action-btn" id="fullscreen-toggle" data-cursor="EXPAND">
            <span>⛶ FULLSCREEN</span>
          </button>
        </div>
      </div>

    </div>

  </div>

  <script src="three.min.js"></script>
  <script src="audio-engine.js"></script>
  <script src="three-scene.js?v=15"></script>
  <script src="cursor.js?v=2"></script>
  <script src="main.js"></script>

  <script>
    // Studio UI Interactive Bindings
    document.addEventListener('DOMContentLoaded', () => {
      // 1. Model Switching
      const modelTabs = document.querySelectorAll('.studio-tab-btn');
      modelTabs.forEach(btn => {
        btn.addEventListener('click', () => {
          modelTabs.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          const modelKey = btn.getAttribute('data-model');
          if (window.setStudioModel) {
            window.setStudioModel(modelKey);
          }
        });
      });

      // 2. Speed Slider
      const speedSlider = document.getElementById('speed-slider');
      const speedDisplay = document.getElementById('speed-val');
      if (speedSlider && speedDisplay) {
        speedSlider.addEventListener('input', (e) => {
          const val = e.target.value;
          speedDisplay.textContent = `${val}x`;
          if (window.setStudioSpeed) {
            window.setStudioSpeed(val);
          }
        });
      }

      // 3. Material Palette
      const matButtons = document.querySelectorAll('.mat-btn');
      matButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          matButtons.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          const matKey = btn.getAttribute('data-mat');
          if (window.setStudioMaterial) {
            window.setStudioMaterial(matKey);
          }
        });
      });

      // 4. Audio Pulse Action
      const pulseBtn = document.getElementById('sound-pulse-toggle');
      if (pulseBtn) {
        pulseBtn.addEventListener('click', () => {
          if (window.AriaAudio) {
            const isPlaying = window.AriaAudio.togglePlayback();
            if (isPlaying) {
              pulseBtn.classList.add('active');
              pulseBtn.innerHTML = '<span>⚡ PULSE ACTIVE</span>';
            } else {
              pulseBtn.classList.remove('active');
              pulseBtn.innerHTML = '<span>⚡ AUDIO PULSE</span>';
            }
          }
        });
      }

      // 5. Fullscreen Toggle
      const fsBtn = document.getElementById('fullscreen-toggle');
      if (fsBtn) {
        fsBtn.addEventListener('click', () => {
          if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(() => {});
            fsBtn.innerHTML = '<span>✕ EXIT FULL</span>';
          } else {
            document.exitFullscreen().catch(() => {});
            fsBtn.innerHTML = '<span>⛶ FULLSCREEN</span>';
          }
        });
      }
    });
  </script>
</body>
</html>
